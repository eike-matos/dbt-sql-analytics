[project]
name = "dagster_orchestrator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "dagster>=1.13,<1.14",
  "dagster-cloud>=1.13,<1.14",
  "dagster-snowflake>=0.29,<0.30",
  "dagster-embedded-elt>=0.29,<0.30",
  "pymongo>=4.6,<5",
  "dlt[snowflake]>=1.0,<2",
  "scikit-learn>=1.5,<1.6",
  "snowflake-connector-python[pandas]>=3.6",
  "python-dotenv>=1.0,<2",
  "matplotlib>=3.8,<4",
]
[project.optional-dependencies]
dev = [
  "dagster-webserver>=1.13,<1.14",
  "pytest",
]
[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
[tool.dagster]
module_name = "dagster_orchestrator.definitions"
code_location_name = "dagster_orchestrator"